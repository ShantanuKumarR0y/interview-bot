<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .avatar {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }

    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }

    .info-box {
      background: #0f0f1a;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 32px;
      text-align: left;
    }
    .info-box p { font-size: 13px; color: #aaa; margin-bottom: 4px; }
    .info-box strong { font-size: 15px; color: #fff; }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #startBtn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    #startBtn:hover { opacity: 0.9; transform: translateY(-1px); }
    #startBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
      min-height: 20px;
    }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #667eea;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .tips {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #2a2a4a;
      text-align: left;
    }
    .tips p { font-size: 12px; color: #666; margin-bottom: 6px; }
    .tips span { color: #888; }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar">🤖</div>
  <h1>AI Interview Room</h1>
  <p class="subtitle">Your interview will be conducted by an AI interviewer</p>

  <div class="info-box">
    <p>Candidate</p>
    <strong id="candidateDisplay">Loading...</strong>
    <p style="margin-top:12px">Role</p>
    <strong id="roleDisplay">Loading...</strong>
  </div>

  <button id="startBtn" onclick="startInterview()">
    🎙️ Start Interview
  </button>

  <div class="status" id="status"></div>

  <div class="tips">
    <p>📋 <span>Make sure your microphone is allowed in the browser</span></p>
    <p>🎧 <span>Use headphones for the best experience</span></p>
    <p>🔇 <span>Find a quiet place before starting</span></p>
  </div>
</div>

<script>
  // ─── Read candidate info from URL params ───────────────────────────────────
  // n8n will send link like: https://yoursite.com?name=John&role=Engineer&key=VAPI_KEY&assistantId=xxx
  const params = new URLSearchParams(window.location.search);
  const candidateName = params.get('name') || 'Candidate';
  const jobRole      = params.get('role') || 'the position';
  const vapiKey      = params.get('key');       ||  'cdf573da-6f12-4ee9-b100-3d817f76c8c4';
  const assistantId  = params.get('assistantId'); || '75025e90-f9f7-4e16-9c0f-25b4735129a8';

  document.getElementById('candidateDisplay').textContent = candidateName;
  document.getElementById('roleDisplay').textContent = jobRole;

  async function startInterview() {
    const btn    = document.getElementById('startBtn');
    const status = document.getElementById('status');

    btn.disabled = true;
    btn.textContent = 'Connecting...';
    status.innerHTML = '<span class="dot"></span> Creating your interview session...';

    try {
      // Step 1: Create a fresh VAPI web call RIGHT NOW
      const res = await fetch('https://api.vapi.ai/call/web', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${vapiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          assistantId: assistantId,
          assistantOverrides: {
            variableValues: {
              candidateName: candidateName,
              jobRole: jobRole
            },
            firstMessage: `Hello ${candidateName}! I'm your AI interviewer today. We'll be discussing your experience for the ${jobRole} role. Are you ready to begin?`
          }
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || 'Failed to create session');
      }

      // Step 2: Redirect to the fresh webCallUrl immediately
      const webCallUrl = data.webCallUrl;
      status.innerHTML = '<span class="dot"></span> Redirecting to your interview...';

      setTimeout(() => {
        window.location.href = webCallUrl;
      }, 1000);

    } catch (err) {
      btn.disabled = false;
      btn.textContent = '🎙️ Start Interview';
      status.textContent = '❌ Error: ' + err.message + '. Please try again.';
      console.error(err);
    }
  }
</script>
</body>
</html>
