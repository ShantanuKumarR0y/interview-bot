<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interviewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .avatar {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }
    .avatar.speaking {
      animation: speakpulse 0.6s infinite alternate;
    }
    @keyframes speakpulse {
      from { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
      to   { box-shadow: 0 0 0 24px rgba(16,185,129,0); }
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    #status { font-size: 14px; color: #aaa; margin-top: 16px; min-height: 22px; }
    #error  { font-size: 13px; color: #ef4444; margin-top: 12px; }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar" id="avatar">🤖</div>
  <h1>AI Interviewer</h1>
  <p class="subtitle">Powered by VAPI</p>
  <div id="status">⏳ Starting interview session...</div>
  <div id="error"></div>
</div>

<script>
  // ─── Config ──────────────────────────────────────────────────────────────────
  const params      = new URLSearchParams(window.location.search);
  const ASSISTANT_ID = params.get('assistantId') || '75025e90-f9f7-4e16-9c0f-25b4735129a8';
  const VAPI_KEY     = params.get('key')          || 'cdf573da-6f12-4ee9-b100-3d817f76c8c4'; // ← replace
  const NAME         = params.get('name')         || 'Candidate';
  const ROLE         = params.get('role')          || 'the position';

  const statusEl = document.getElementById('status');
  const errorEl  = document.getElementById('error');
  const avatar   = document.getElementById('avatar');

  // ─── Step 1: Create VAPI web call via REST API ───────────────────────────────
  async function startInterview() {
    statusEl.textContent = '🔗 Creating voice session...';

    try {
      const res = await fetch('https://api.vapi.ai/call/web', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${VAPI_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          assistantId: ASSISTANT_ID,
          assistantOverrides: {
            firstMessage: `Hello ${NAME}! I am your AI interviewer. We will discuss your experience for the ${ROLE} role. Are you ready?`,
            variableValues: { candidateName: NAME, jobRole: ROLE }
          }
        })
      });

      const data = await res.json();
      console.log('VAPI response:', data);

      if (!res.ok) {
        throw new Error(data.message || JSON.stringify(data));
      }

      // ─── Step 2: Connect to Daily.co WebRTC room ────────────────────────────
      const dailyUrl = data.webCallUrl;
      statusEl.textContent = '🎙️ Connecting to audio session...';
      console.log('Daily URL:', dailyUrl);

      await connectToDaily(dailyUrl);

    } catch(err) {
      console.error('Start error:', err);
      errorEl.textContent = '❌ ' + err.message;
      statusEl.textContent = 'Failed to start interview';
    }
  }

  // ─── Step 2: Load Daily.co SDK and join room ──────────────────────────────
  async function connectToDaily(url) {
    return new Promise((resolve, reject) => {
      // Load Daily.co SDK (smaller, more reliable than VAPI SDK in bot browsers)
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/@daily-co/daily-js';
      script.onload = async () => {
        try {
          const call = window.DailyIframe.createCallObject({
            audioSource: true,
            videoSource: false,
            dailyConfig: { experimentalChromeVideoMuteLightOff: true }
          });

          call.on('joined-meeting', () => {
            statusEl.textContent = '✅ Interview active — AI is speaking';
            avatar.classList.add('speaking');
            resolve();
          });

          call.on('participant-updated', (e) => {
            const p = e.participant;
            if (p.audio) {
              statusEl.textContent = '🔊 AI Interviewer is speaking...';
              avatar.classList.add('speaking');
            } else {
              statusEl.textContent = '👂 Listening...';
              avatar.classList.remove('speaking');
            }
          });

          call.on('left-meeting', () => {
            statusEl.textContent = '✅ Interview complete. Thank you!';
            avatar.classList.remove('speaking');
          });

          call.on('error', (e) => {
            console.error('Daily error:', e);
            errorEl.textContent = 'Audio error: ' + e.errorMsg;
          });

          await call.join({ url });
          statusEl.textContent = '🎙️ Joined — waiting for AI to speak...';

        } catch(e) {
          reject(e);
        }
      };
      script.onerror = () => reject(new Error('Failed to load Daily.co SDK'));
      document.head.appendChild(script);
    });
  }

  // ─── Auto-start on page load ─────────────────────────────────────────────────
  window.addEventListener('load', () => {
    setTimeout(startInterview, 1000);
  });
</script>
</body>
</html>
