<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .avatar {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(102,126,234,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(102,126,234,0); }
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .status {
      font-size: 15px;
      color: #aaa;
      margin-top: 20px;
      min-height: 24px;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #667eea;
      margin-right: 6px;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .speaking { color: #10b981; font-weight: 600; }
    .listening { color: #667eea; font-weight: 600; }
    .error { color: #ef4444; font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar">🤖</div>
  <h1>AI Interviewer</h1>
  <p class="subtitle">Interview session is starting...</p>
  <div class="status" id="status">
    <span class="dot"></span> Connecting to VAPI...
  </div>
  <div class="error" id="error"></div>
</div>

<script>
  // ─── Config — hardcoded fallbacks so it works even without URL params ────────
  const params      = new URLSearchParams(window.location.search);
  const assistantId = params.get('assistantId') || '75025e90-f9f7-4e16-9c0f-25b4735129a8';
  const vapiKey     = params.get('key')         || '0fdb05db-87c2-45e5-8b30-b538f998f928'; // ← replace this
  const name        = params.get('name')        || 'Candidate';
  const role        = params.get('role')        || 'the position';

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = 'status ' + (cls || '');
  }

  // ─── Auto-start VAPI as soon as page loads ───────────────────────────────────
  window.addEventListener('load', () => {
    setTimeout(initVapi, 1500); // small delay to ensure SDK loads
  });

  function initVapi() {
    if (typeof Vapi === 'undefined') {
      document.getElementById('error').textContent = 'VAPI SDK failed to load. Check internet connection.';
      return;
    }

    try {
      const vapi = new Vapi(vapiKey);

      // ─── Auto-start call immediately ──────────────────────────────────────
      vapi.start({
        assistantId: assistantId,
        assistantOverrides: {
          firstMessage: `Hello ${name}! I am your AI interviewer today. We will be discussing your experience for the ${role} role. Are you ready to begin?`,
          variableValues: { candidateName: name, jobRole: role }
        }
      });

      // ─── Event listeners ──────────────────────────────────────────────────
      vapi.on('call-start', () => {
        setStatus('<span class="dot"></span> Interview started — AI is ready', 'listening');
      });

      vapi.on('speech-start', () => {
        setStatus('🔊 AI Interviewer is speaking...', 'speaking');
      });

      vapi.on('speech-end', () => {
        setStatus('<span class="dot"></span> Listening to you...', 'listening');
      });

      vapi.on('call-end', () => {
        setStatus('✅ Interview complete. Thank you!');
      });

      vapi.on('error', (e) => {
        console.error('VAPI error:', e);
        document.getElementById('error').textContent = 'Error: ' + (e?.message || JSON.stringify(e));
        setStatus('❌ Connection failed');
      });

    } catch(err) {
      console.error(err);
      document.getElementById('error').textContent = 'Failed to start: ' + err.message;
    }
  }
</script>

<!-- VAPI Web SDK -->
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.umd.js" onload="console.log('VAPI SDK loaded')" onerror="document.getElementById('error').textContent='Failed to load VAPI SDK'"></script>

</body>
</html>
