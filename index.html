<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>AI Interviewer</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 20px; padding: 48px 40px;
      max-width: 480px; width: 90%; text-align: center;
    }
    .avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin: 0 auto 24px;
      transition: box-shadow 0.3s;
    }
    .avatar.speaking { box-shadow: 0 0 0 12px rgba(16,185,129,0.3); }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    #status { font-size: 14px; color: #aaa; margin-top: 16px; }
    #error { font-size: 13px; color: #ef4444; margin-top: 12px; }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar" id="avatar">🤖</div>
  <h1>AI Interviewer</h1>
  <p class="subtitle">Powered by VAPI</p>
  <div id="status">Starting...</div>
  <div id="error"></div>
</div>

<script>
  const params       = new URLSearchParams(window.location.search);
  const ASSISTANT_ID = params.get('assistantId') || '75025e90-f9f7-4e16-9c0f-25b4735129a8';
  const VAPI_KEY     = params.get('key')          || 'cdf573da-6f12-4ee9-b100-3d817f76c8c4'; // ← replace
  const NAME         = params.get('name')         || 'Candidate';
  const ROLE         = params.get('role')          || 'the position';

  const statusEl = document.getElementById('status');
  const errorEl  = document.getElementById('error');
  const avatar   = document.getElementById('avatar');

  let audioCtx, micSource, peerConnection;

  async function start() {
    try {
      // Step 1: Get mic — Recall pipes meeting audio here
      statusEl.textContent = '🎤 Connecting microphone...';
      const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new AudioContext();
      micSource = audioCtx.createMediaStreamSource(micStream);

      // Step 2: Create VAPI web call
      statusEl.textContent = '🔗 Creating VAPI session...';
      const res = await fetch('https://api.vapi.ai/call/web', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + VAPI_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          assistantId: ASSISTANT_ID,
          assistantOverrides: {
            firstMessage: 'Hello ' + NAME + '! I am your AI interviewer. We will discuss your experience for the ' + ROLE + ' role. Are you ready to begin?',
            variableValues: { candidateName: NAME, jobRole: ROLE }
          }
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.message || JSON.stringify(data));
      console.log('VAPI call created:', data.id, data.webCallUrl);

      // Step 3: Connect to Daily.co via WebRTC directly (no SDK needed)
      // Extract room name from Daily URL
      const roomUrl = data.webCallUrl;
      statusEl.textContent = '🎙️ Joining voice session...';

      // Use Daily's REST API to get a meeting token, then connect via WebRTC
      // Simpler: just load Daily in an audio element via their embed
      await joinDailyViaAudio(roomUrl, micStream);

    } catch(err) {
      console.error(err);
      errorEl.textContent = '❌ ' + err.message;
      statusEl.textContent = 'Failed';
    }
  }

  async function joinDailyViaAudio(roomUrl, micStream) {
    // Create RTCPeerConnection to join Daily room
    // Daily.co supports standard WebRTC
    statusEl.textContent = '✅ AI Interviewer active';
    avatar.classList.add('speaking');

    // Load Daily.co as audio-only via their JS API
    // The key: play audio through AudioContext so Recall captures it
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/@daily-co/daily-js@0.70.0/dist/daily-iframe.js';
    document.head.appendChild(script);

    script.onload = async () => {
      try {
        // Create call object - audio only
        const call = window.DailyIframe.createCallObject({
          audioSource: micStream.getAudioTracks()[0], // use Recall's mic input
          videoSource: false,
          subscribeToTracksAutomatically: true
        });

        call.on('track-started', async (event) => {
          if (event.track.kind === 'audio' && !event.participant.local) {
            console.log('Remote audio track started - playing through AudioContext');

            // THIS IS THE KEY: play remote audio through AudioContext
            // so Recall captures it and streams to meeting
            const remoteStream = new MediaStream([event.track]);
            const remoteSource = audioCtx.createMediaStreamSource(remoteStream);

            // Create gain node and connect to destination (speakers)
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 2.0; // boost volume
            remoteSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Also play via Audio element as backup
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.volume = 1.0;
            audio.play().catch(e => console.log('Audio play error:', e));

            statusEl.textContent = '🔊 AI is speaking...';
            avatar.classList.add('speaking');
          }
        });

        call.on('joined-meeting', () => {
          statusEl.textContent = '✅ Connected — interview in progress';
        });

        call.on('participant-updated', (e) => {
          if (!e.participant.local) {
            statusEl.textContent = e.participant.tracks?.audio?.state === 'playable'
              ? '🔊 AI is speaking...'
              : '👂 Listening...';
          }
        });

        call.on('left-meeting', () => {
          statusEl.textContent = '✅ Interview complete!';
          avatar.classList.remove('speaking');
        });

        call.on('error', e => {
          errorEl.textContent = 'Call error: ' + e.errorMsg;
        });

        await call.join({ url: roomUrl, startAudioOff: false });
        statusEl.textContent = '🎙️ Joined — AI is connecting...';

      } catch(e) {
        errorEl.textContent = 'Join error: ' + e.message;
        console.error(e);
      }
    };

    script.onerror = () => {
      errorEl.textContent = 'Failed to load audio SDK';
    };
  }

  // Start immediately on load
  document.addEventListener('DOMContentLoaded', start);
</script>
</body>
</html>
