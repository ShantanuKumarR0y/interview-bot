<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interviewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 20px; padding: 48px 40px;
      max-width: 480px; width: 90%; text-align: center;
    }
    .avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin: 0 auto 24px;
    }
    .avatar.speaking { animation: speakpulse 0.6s infinite alternate; }
    @keyframes speakpulse {
      from { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
      to   { box-shadow: 0 0 0 24px rgba(16,185,129,0); }
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    #status { font-size: 14px; color: #aaa; margin-top: 16px; min-height: 22px; }
    #error  { font-size: 13px; color: #ef4444; margin-top: 12px; }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar" id="avatar">🤖</div>
  <h1>AI Interviewer</h1>
  <p class="subtitle">Powered by VAPI</p>
  <div id="status">Starting interview...</div>
  <div id="error"></div>
</div>

<script>
  // ─── Config ────────────────────────────────────────────────────────────────
  const params       = new URLSearchParams(window.location.search);
  const ASSISTANT_ID = params.get('assistantId') || '75025e90-f9f7-4e16-9c0f-25b4735129a8';
  const VAPI_KEY     = params.get('key')          || 'cdf573da-6f12-4ee9-b100-3d817f76c8c4'; // ← replace
  const NAME         = params.get('name')         || 'Candidate';
  const ROLE         = params.get('role')          || 'the position';

  const statusEl = document.getElementById('status');
  const errorEl  = document.getElementById('error');
  const avatar   = document.getElementById('avatar');

  // ─── Key insight: Recall captures audio from the page's AudioContext ────────
  // We must use getUserMedia (mic = meeting audio) + play TTS through AudioContext
  // so Recall streams it back into the meeting.

  let audioContext;
  let vapiCallId;
  let pollInterval;

  async function startInterview() {
    try {
      // Step 1: Get microphone (Recall sends meeting audio here)
      statusEl.textContent = '🎤 Accessing meeting audio...';
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(stream);
      source.connect(audioContext.destination); // loopback so VAPI hears it

      // Step 2: Create VAPI web call
      statusEl.textContent = '🔗 Connecting to AI interviewer...';
      const res = await fetch('https://api.vapi.ai/call/web', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + VAPI_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          assistantId: ASSISTANT_ID,
          assistantOverrides: {
            firstMessage: 'Hello ' + NAME + '! I am your AI interviewer. We will discuss your experience for the ' + ROLE + ' role. Are you ready to begin?',
            variableValues: { candidateName: NAME, jobRole: ROLE }
          }
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.message || JSON.stringify(data));
      vapiCallId = data.id;

      // Step 3: Join Daily.co room — audio plays through page = Recall captures it
      statusEl.textContent = '🎙️ Joining voice session...';
      const roomUrl = data.webCallUrl;

      // Create hidden iframe to join Daily room
      // Daily.co audio output goes through browser audio = Recall captures it
      const iframe = document.createElement('iframe');
      iframe.src = roomUrl + '?prejoinPage=skip&showLeaveButton=false&showFullscreenButton=false';
      iframe.allow = 'microphone; camera; autoplay; display-capture';
      iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;opacity:0;border:none;z-index:-1;';
      document.body.appendChild(iframe);

      statusEl.textContent = '✅ AI Interviewer is active — interview in progress';
      avatar.classList.add('speaking');

      // Poll VAPI call status
      pollInterval = setInterval(async () => {
        try {
          const r = await fetch('https://api.vapi.ai/call/' + vapiCallId, {
            headers: { 'Authorization': 'Bearer ' + VAPI_KEY }
          });
          const d = await r.json();
          if (d.status === 'ended') {
            clearInterval(pollInterval);
            statusEl.textContent = '✅ Interview complete. Thank you!';
            avatar.classList.remove('speaking');
          }
        } catch(e) {}
      }, 5000);

    } catch(err) {
      console.error('Error:', err);
      errorEl.textContent = '❌ ' + err.message;
      statusEl.textContent = 'Failed to start';
    }
  }

  document.addEventListener('DOMContentLoaded', startInterview);
</script>
</body>
</html>
